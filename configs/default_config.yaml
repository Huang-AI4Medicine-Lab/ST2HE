# Default configuration for ST2HE inference

model:
  # Path to the trained pix2pix-turbo weights file
  # Update this path to point to your trained weights
  path: "weights/UnCondGen.pkl"
  
  # Text prompt for the model
  prompt: "image of HE"
  
  # Translation direction used by the vendored pix2pix-turbo ST2HE inference
  direction: "a2b"
  
  # Image preparation method
  # Options: "no_resize", "resize_512x512", etc.
  image_prep: "no_resize"

inference:
  # Use Float16 precision for faster inference (requires compatible GPU)
  use_fp16: false
  
  # Device to use: "cuda" or "cpu"
  device: "cuda"

paths:
  # Default paths (can be overridden via command line)
  default_input_dir: "/path/to/input/images"
  default_output_dir: "outputs/st2he_results"

sample_generation:
  # Number of variations to generate per input
  num_variations: 1
  
  # Save side-by-side comparison images
  save_comparison: true
